name: Build Quest QMOD
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QPM, Ninja & Single-Header Audio Decoders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build unzip
          gh release download -R QuestPackageManager/QPM.CLI -p "qpm-linux-x64.zip" -D /tmp
          sudo unzip -o /tmp/qpm-linux-x64.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/qpm
          curl -fsSL https://githubusercontent.com -o include/dr_mp3.h
          curl -fsSL https://githubusercontent.com -o include/dr_wav.h
      - name: Resolve Dependencies & Build QMOD
        run: |
          qpm restore
          qpm ndk resolve -d
          cmake -G Ninja -DCMAKE_BUILD_TYPE="RelWithDebInfo" -B build
          cmake --build build
          qpm qmod zip
      - name: Upload T3RA-MIZU.qmod
        uses: actions/upload-artifact@v4
        with:
          name: T3RA-MIZU-qmod
          path: T3RA-MIZU.qmod
